<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartLMS</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--fg:#1d2b36;--mut:#6b7c89;--bd:#dbe5ec;--brand:#0b5f8a;--brand2:#1d8fc2;--cyan:#72d1e8;--cyan2:#e3f5fa;--bad:#c62828;--ok:#2e7d32;--amber:#a86200;--warn:#fff4d6;--shadow:0 1px 3px rgba(16,42,67,.08),0 4px 14px rgba(16,42,67,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e141a;--card:#17202a;--fg:#e4ebf1;--mut:#8da0ae;--bd:#27333f;--brand:#6cc3ee;--brand2:#3aa6dc;--cyan:#1c4a5c;--cyan2:#16384a;--bad:#ff7b72;--ok:#6fcf74;--amber:#f0b44c;--warn:#3a2f10;--shadow:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
a{color:var(--brand);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
header{background:linear-gradient(110deg,#0b3d5c,#0b5f8a 55%,#1d8fc2);color:#fff;border-bottom:5px solid #8fd3c4}
.top{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{color:#fff;font:700 26px Georgia,serif;letter-spacing:.3px}.logo small{display:block;font:600 10px system-ui;letter-spacing:2px;opacity:.8}a.logo:hover{text-decoration:none}
.sp{flex:1}.chip{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:13px}
details.me{position:relative}details.me summary{list-style:none;cursor:pointer;background:rgba(0,0,0,.28);padding:6px 12px;border-radius:6px;font-size:14px}
details.me summary::-webkit-details-marker{display:none}
.badge{background:#d32f2f;color:#fff;border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;margin-left:6px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);width:min(320px,90vw);z-index:10;padding:6px 0}
.menu a,.menu b,.menu>span{display:block;padding:6px 14px;font-size:14px}.menu a{color:var(--fg)}.menu a:hover{background:var(--cyan2);text-decoration:none}.menu hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
nav{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav a{color:#d6ecf7;padding:9px 14px;border-radius:8px 8px 0 0;font-size:14px;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--brand);font-weight:600}nav a:hover{text-decoration:none;background:rgba(255,255,255,.12)}nav a.on:hover{background:var(--bg)}
main{max-width:1240px;margin:0 auto;padding:20px 16px}
h1{font:600 25px "Segoe UI",system-ui,sans-serif;margin:0 0 16px;color:var(--brand)}
.grid{display:grid;grid-template-columns:250px 1fr 1fr;gap:18px;align-items:start}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.calwrap{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.grid,.cols,.calwrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px;overflow:auto}
.card>h3{margin:0;padding:10px 16px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));color:#0b3d5c;font-size:15px}
@media(prefers-color-scheme:dark){.card>h3{color:#cfeaf6}}
.card>div,.card>p{margin:0;padding:12px 16px}.card>.list{padding:0}
.list>a{display:block;padding:9px 16px;border-bottom:1px dashed var(--bd);color:var(--fg)}.list>a:hover{background:var(--cyan2);text-decoration:none}.list>a:last-child{border:0}
.item{border-bottom:1px solid var(--bd)}.card>.item:last-child{border:0}
.more{text-align:right}.muted{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);font-style:italic;padding:22px 16px}
input,select,textarea,button{font:inherit;padding:7px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
textarea{width:100%;min-height:90px}
button{cursor:pointer;background:var(--brand2);color:#fff;border:0}button:hover{filter:brightness(1.08)}
button.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.bar{background:repeating-linear-gradient(135deg,#2f78b5,#2f78b5 4px,#3584c4 4px,#3584c4 8px);color:#fff;padding:12px 20px;border-radius:10px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar a{color:#fff;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.form2{display:grid;gap:8px;border-bottom:1px solid var(--bd);background:var(--bg)}.form2 button{justify-self:start}.row.form2{display:flex;margin:0}
.form{display:grid;gap:12px;max-width:520px}.form label{display:grid;gap:4px}.form .chk{display:flex;gap:8px;align-items:center}
fieldset{border:1px solid var(--bd);border-radius:8px;display:grid;gap:8px}
table{border-collapse:collapse;width:100%}th{background:var(--bg);font-size:13px;color:var(--mut);white-space:nowrap}td,th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}.amber{color:var(--amber);font-weight:600}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:var(--cyan2);color:var(--brand);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--brand);margin-bottom:14px;flex-wrap:wrap}.tabs a{padding:7px 14px;border-radius:8px 8px 0 0;color:var(--mut)}.tabs a.on{background:var(--brand);color:#fff;text-decoration:none}
.ann{display:grid;grid-template-columns:1fr 220px;gap:16px;padding:16px;border-bottom:1px solid var(--bd)}.ann:last-child{border:0}
.ann h4{margin:0 0 4px;color:#c0392b;font-size:16px}@media(max-width:700px){.ann{grid-template-columns:1fr}}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--bd);border-top:1px solid var(--bd);background:var(--card)}
.cal>div{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);min-height:96px;padding:4px 5px;font-size:13px;overflow:hidden}
.cal .h{min-height:0;text-align:center;color:var(--mut);font-size:12px;background:var(--bg)}
.cal .dim{color:var(--mut);background:var(--bg)}.cal .today{background:var(--cyan2)}.cal b{display:block;text-align:right}
.ev{display:block;margin-top:3px;padding:1px 6px;border-radius:4px;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev i{font-style:normal;font-weight:700;margin-right:4px}
.calsel{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px;cursor:pointer}.calsel i{flex:none;width:12px;height:12px;border-radius:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.done{text-decoration:line-through;color:var(--mut)}
.chead{border-left:6px solid;padding:2px 0 2px 14px;margin-bottom:18px}.chead h1{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}.stat b{display:block;font-size:22px;color:var(--brand)}.stat>span{color:var(--mut);font-size:13px}
.meter{display:inline-block;width:110px;height:8px;background:var(--bd);border-radius:4px;vertical-align:middle;overflow:hidden;margin-right:6px}.meter i{display:block;height:100%;background:var(--brand2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa7b1;margin-right:6px}.dot.on{background:#2e9e45;box-shadow:0 0 0 3px rgba(46,158,69,.2)}
.warn{background:var(--warn);border:1px solid #e8c066;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.q{padding:12px 0;border-bottom:1px dashed var(--bd)}.q label{display:block;padding:4px 0 4px 10px;cursor:pointer}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.mail{white-space:pre-wrap;border-left:3px solid var(--cyan);padding-left:12px;margin-top:4px}
.login{max-width:400px;margin:8vh auto;padding:0 16px}.login .card>div{display:grid;gap:10px}
</style></head><body><div id="app"></div>
<script>
let token, user, timer, due = [], cal = { y: new Date().getFullYear(), m: new Date().getMonth() }, hiddenCal = new Set(), taskFilter = 'all', mailTab = 'inbox', annTab = 'all';
try { ({ token, user } = JSON.parse(sessionStorage.auth)); } catch {}
const persist = () => { try { sessionStorage.auth = JSON.stringify({ token, user }); } catch {} };
const $ = s => document.querySelector(s), v = s => $(s).value;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const api = async (path, body) => {
  const r = await fetch('/api' + path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + token }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (r.status === 401 && token) { logout(); throw new Error(j.error); }
  if (!r.ok) { alert(j.error); throw new Error(j.error); }
  return j;
};
const fmt = t => t ? new Date(t).toLocaleString('vi-VN') : '';
const ymd = (d = new Date()) => d.toLocaleDateString('sv');
const nowStr = () => new Date().toLocaleString('sv').replace(' ', 'T').slice(0, 16);
const dt = s => String(s || '').replace('T', ' ');
const ROLE = { teacher: 'Giảng viên', student: 'Sinh viên', proctor: 'Cán bộ khảo thí' };
const COLORS = ['#6a2c91', '#b03a2e', '#1f6f8b', '#8a5a00', '#2e7d32', '#5b4b8a', '#ad1457'];
const color = id => id ? COLORS[id % COLORS.length] : '#607d8b';
const KIND = { assignment: 'Bài tập', exam: 'Kỳ thi', task: 'Công việc', event: 'Sự kiện cá nhân' };
const staff = () => user.role !== 'student';
const L = (js, html) => `<a href="#" onclick="${js};return false">${html}</a>`;
const empty = t => `<div class="empty">${t}</div>`;
const bar = p => `<span class="meter"><i style="width:${p}%"></i></span>${p}%`;
const dot = on => `<span class="dot ${on ? 'on' : ''}"></span>${on ? 'Online' : 'Offline'}`;
const OPS = id => `<select id=${id}><option value=contains>Chứa</option><option value=equals>Bằng</option><option value=starts>Bắt đầu bằng</option></select>`;
const add = async (path, body, page, arg) => { await api(path, body); go(page, arg); };
const csv = rows => { const k = Object.keys(rows[0] || {}); return [k, ...rows.map(r => k.map(x => r[x]))].map(r => r.map(c => { let s = c && typeof c === 'object' ? JSON.stringify(c) : String(c ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }).join(',')).join('\r\n'); };
const download = (name, rows) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv(rows.map(r => ({ ...r, ts: fmt(r.ts) })))], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); };
const upcoming = () => { const n = nowStr(), t = ymd(), w = ymd(new Date(Date.now() + 7 * 864e5)); return due.filter(x => !x.done && x.date && x.date >= (x.date.length > 10 ? n : t) && x.date.slice(0, 10) <= w).sort((a, b) => a.date.localeCompare(b.date)); };
const openItem = x => x.course_id ? (x.kind === 'exam' ? "go('exams')" : `go('course',${x.course_id})`) : x.kind === 'task' ? "go('tasks')" : "go('calendar')";

const TOOLS = () => [['announcements', 'Thông báo'], ['calendar', 'Lịch'], ['tasks', 'Công việc'], ['grades', 'Kết quả học tập'], ['email', 'Gửi email'], ['directory', 'Danh bạ người dùng'], ['addressbook', 'Sổ địa chỉ'], ['profile', 'Thông tin cá nhân'], ['goalperf', 'Kết quả chuẩn đầu ra'], ['goals', 'Chuẩn đầu ra (CLO)'], ...(staff() ? [['devices', 'Thiết bị IoT / Edge']] : [])];
const TABS = () => [['home', 'Trang chủ'], ['courses', 'Khóa học'], ['exams', 'Kỳ thi'], ['calendar', 'Lịch'], ...(staff() ? [['monitor', 'Giám sát thi'], ['reports', 'Báo cáo & truy xuất']] : [['grades', 'Kết quả học tập']])];
const TITLES = { subs: 'Chấm bài', log: 'Nhật ký phiên thi', emailTo: 'Gửi email' };

// ---------- shell / router ----------
const P = {};
async function go(page, arg) {
  clearTimeout(timer);
  let body;
  try { due = await api('/calendar'); body = await P[page](arg); } catch (e) { return console.error(e); }
  const title = page === 'home' || page === 'course' ? '' : [...TABS(), ...TOOLS()].find(t => t[0] === page)?.[1] ?? TITLES[page];
  const active = { course: 'courses', subs: 'courses', log: 'exams' }[page] || page, soon = upcoming();
  history.replaceState(null, '', '#' + page + (arg ? '/' + arg : ''));
  $('#app').innerHTML = `<header><div class="top"><a class="logo" href="#" onclick="go('home');return false"><small>LMS · IoT · EDGE AI · CLOUD</small>SmartLMS</a><div class="sp"></div>
    <details class="me"><summary>${esc(user.name)}<span class="badge" title="Đến hạn trong 7 ngày">${soon.length}</span> ▾</summary><div class="menu">
      <span class="muted">${ROLE[user.role]} · ${esc(user.email)}</span><hr><b>Sắp đến hạn (7 ngày)</b>
      ${soon.map(x => L(openItem(x), `<span class="sw" style="background:${color(x.course_id)}"></span>${dt(x.date)} · ${esc(x.title)}`)).join('') || '<span class="muted">Không có mục nào.</span>'}
      <hr>${L("go('grades')", 'Kết quả học tập')}${L("go('calendar')", 'Lịch')}${L("go('profile')", 'Thông tin cá nhân')}<hr>${L('logout()', 'Đăng xuất')}</div></details></div>
    <nav>${TABS().map(t => `<a href="#" class="${t[0] === active ? 'on' : ''}" onclick="go('${t[0]}');return false">${t[1]}</a>`).join('')}</nav></header>
    <main>${title ? `<h1>${esc(title)}</h1>` : ''}${body}</main>`;
  P[page + '_']?.(arg);
}
function logout() { token = user = null; try { sessionStorage.removeItem('auth'); } catch {} clearTimeout(timer); login(); }
function login() {
  $('#app').innerHTML = `<div class="login"><div style="text-align:center;margin-bottom:14px"><div class="logo" style="color:var(--brand)">SmartLMS</div><div class="muted">Hệ thống quản lý học tập · IoT + Edge AI + Cloud</div></div>
  <div class="card"><h3>Đăng nhập</h3><div><input id=e value="sv@demo.vn" placeholder="Email" autocomplete="username"><input id=p type=password value="123" placeholder="Mật khẩu" autocomplete="current-password">
  <button id=go>Đăng nhập</button><span class="muted">Demo (mật khẩu 123): gv@ giảng viên · sv@, sv2@ sinh viên · kt@ khảo thí — @demo.vn</span></div></div></div>`;
  const submit = async () => {
    const r = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ email: v('#e'), password: v('#p') }) }).then(r => r.json());
    if (r.error) return alert(r.error);
    ({ token, user } = r); persist(); go('home');
  };
  $('#go').onclick = submit; $('#p').onkeydown = e => e.key === 'Enter' && submit();
}

// ---------- Trang chủ (portal) ----------
P.home = async () => {
  const [ann, tasks, courses, sess] = await Promise.all([api('/announcements'), api('/tasks'), api('/courses'), staff() ? api('/sessions') : []]);
  const inst = ann.filter(a => !a.course_id && a.ts > Date.now() - 7 * 864e5), now = nowStr();
  const alerts = staff()
    ? sess.filter(s => s.alerts && !s.review).map(s => `<div class="item">${L(`go('log',${s.id})`, `Phiên #${s.id} — ${esc(s.student)}`)}<br><span class="bad">${s.alerts} cảnh báo</span> <span class="muted">chưa rà soát · ${esc(s.exam)}</span></div>`).join('') || empty('Không có phiên thi cần rà soát.')
    : [...due.filter(x => x.kind === 'assignment' && !x.done && x.date < now).map(x => `<div class="item"><span class="bad">Quá hạn</span> ${L(openItem(x), esc(x.title))}<div class="muted">Hạn ${dt(x.date)}</div></div>`),
       ...upcoming().map(x => `<div class="item"><span class="amber">Sắp đến hạn</span> ${L(openItem(x), esc(x.title))}<div class="muted">${KIND[x.kind]} · ${dt(x.date)}</div></div>`)].join('') || empty('Không có cảnh báo.');
  return `<div class="grid">
  <div><div class="card"><h3>Công cụ</h3><div class="list">${TOOLS().map(([k, l]) => L(`go('${k}')`, l)).join('')}</div></div>
    <div class="card"><h3>Cảnh báo</h3>${alerts}</div></div>
  <div><div class="card"><h3>Thông báo của tôi</h3>
      ${inst.map(a => `<div class="item"><b>${esc(a.title)}</b><div class="muted">${fmt(a.ts)} · ${esc(a.author)}</div></div>`).join('') || '<p class="empty">Không có thông báo toàn trường trong 7 ngày qua.</p>'}
      ${courses.filter(c => c.news.length).map(c => `<div class="item">${esc(c.code)} — ${esc(c.title)}${c.news.map(n => `<div>› ${L("annTab='course';go('announcements')", esc(n.title))}</div>`).join('')}</div>`).join('')}
      <p class="more">${L("annTab='all';go('announcements')", 'Xem thêm thông báo…')}</p></div>
    <div class="card"><h3>Công việc của tôi</h3>${tasks.filter(t => !t.done).slice(0, 5).map(t => `<div class="item">${esc(t.title)} <span class="muted">${t.due || ''}</span></div>`).join('') || empty('Không có công việc đến hạn.')}
      <p class="more">${L("go('tasks')", 'Xem thêm công việc…')}</p></div></div>
  <div><div class="card"><h3>Khóa học của tôi</h3><p class="muted">Khóa học bạn tham gia với vai trò: ${ROLE[user.role]}</p>
      ${courses.map(c => `<div class="item">${L(`go('course',${c.id})`, `<span class="sw" style="background:${color(c.id)}"></span><b>${esc(c.code)} — ${esc(c.title)}</b>`)}${c.news.length ? `<div class="muted">Thông báo:</div>${c.news.map(n => `<div>› ${esc(n.title)}</div>`).join('')}` : ''}</div>`).join('') || empty('Chưa có khóa học.')}</div>
    <div class="card"><h3>Báo cáo</h3><div class="list">${(staff() ? [['reports', 'Báo cáo đánh giá & truy xuất sự kiện'], ['monitor', 'Giám sát thi trực tiếp'], ['devices', 'Thiết bị IoT / Edge']] : [['grades', 'Kết quả học tập'], ['goalperf', 'Kết quả chuẩn đầu ra']]).map(([k, l]) => L(`go('${k}')`, l)).join('')}</div></div></div></div>`;
};

// ---------- Khóa học ----------
P.courses = async () => {
  const courses = await api('/courses');
  return (user.role === 'teacher' ? `<div class="bar"><b>Tạo khóa học</b><input id=cc placeholder="Mã môn (vd IT150IU)"><input id=cn placeholder="Tên khóa học" style="flex:1"><button onclick="add('/courses',{code:v('#cc'),title:v('#cn')},'courses')">Tạo</button></div>` : '') +
    `<div class="card"><h3>Khóa học bạn tham gia với vai trò: ${ROLE[user.role]}</h3><div class="list">${courses.map(c => L(`go('course',${c.id})`, `<span class="sw" style="background:${color(c.id)}"></span><b>${esc(c.code)} — ${esc(c.title)}</b> <span class="muted">· GV ${esc(c.teacher)}</span>`)).join('') || empty('Chưa có khóa học.')}</div></div>`;
};
const aStatus = a => a.grade != null ? `<span class="ok">Điểm ${a.grade}/${a.points}</span>${a.feedback ? ` <span class="muted">— ${esc(a.feedback)}</span>` : ''}`
  : a.sub_ts ? `Đã nộp ${fmt(a.sub_ts)}${a.sub_ts > new Date(a.due) ? ' <span class="bad">(muộn)</span>' : ''} — chờ chấm`
  : a.due < nowStr() ? '<span class="bad">Quá hạn — chưa nộp</span>' : 'Chưa nộp';
P.course = async id => {
  const c = await api('/courses/' + id), t = user.role === 'teacher', st = user.role === 'student';
  const card = (title, body, form = '') => `<div class="card"><h3>${title}</h3>${t ? form : ''}${body}</div>`;
  return `<div class="chead" style="border-color:${color(c.id)}"><span class="muted">${esc(c.code)}</span><h1>${esc(c.title)}</h1>
    <span class="muted">Giảng viên: ${esc(c.teacher)} · ${c.roster.filter(m => m.role === 'student').length} sinh viên · ${c.questions} câu hỏi trong ngân hàng</span></div>
  <div class="cols"><div>
  ${card('Thông báo khóa học', c.news.map(a => `<div class="item"><b>${esc(a.title)}</b><div class="muted">${fmt(a.ts)} · ${esc(a.author)}</div><div class="pre">${esc(a.body)}</div></div>`).join('') || empty('Chưa có thông báo.'),

async function startExam(id) {
  const s = await api(`/exams/${id}/start`, {}), key = 'ans' + s.session_id;
  let ans = {}, n = 0, finished = false, quiet = false;
  try { ans = JSON.parse(sessionStorage[key] || '{}'); } catch {}
  window.ans = ans; window.saveAns = () => { try { sessionStorage[key] = JSON.stringify(ans); } catch {} };
  const note = (type, detail = {}) => { if (finished) return; $('#n').textContent = ++n; fetch('/api/events', { method: 'POST', headers: { authorization: 'Bearer ' + token }, body: JSON.stringify({ session_id: s.session_id, type, detail }) }).catch(() => {}); };
  const on = {
    visibilitychange: () => document.hidden && note('tab_blur'),
    blur: () => !quiet && setTimeout(() => !document.hidden && note('window_blur'), 150), // rời sang ứng dụng khác (không phải đổi tab)
    copy: () => note('copy_paste', { kind: 'copy' }), cut: () => note('copy_paste', { kind: 'cut' }), paste: () => note('copy_paste', { kind: 'paste' }),
    fullscreenchange: () => !document.fullscreenElement && note('fullscreen_exit'),
  };
  const listen = f => Object.entries(on).forEach(([k, h]) => (k === 'blur' ? window : document)[f](k, h));
  $('#app').innerHTML = `<header><div class="top"><div class="logo">SmartLMS</div><div class="sp"></div><span class="chip">Phiên #${s.session_id}</span><span class="chip">Còn lại <b id=left></b></span></div></header>
  <main><div class="warn">Bài thi đang được giám sát: chuyển tab/cửa sổ, sao chép/dán, thoát toàn màn hình sẽ được ghi vào nhật ký (đã ghi <b id=n>0</b> sự kiện từ trình duyệt).
    Camera Edge AI & cảm biến phòng thi gửi sự kiện song song — giả lập: <code>npm run sim -- ${s.session_id}</code></div>
  <div class="card"><h3>${esc(s.title)}</h3><div>${s.questions.map((q, i) => `<div class="q"><b>Câu ${i + 1}. ${esc(q.text)}</b>${q.options.map((o, j) => `<label><input type=radio name=q${q.id} ${ans[q.id] === j ? 'checked' : ''} onchange="ans[${q.id}]=${j};saveAns()"> ${esc(o)}</label>`).join('')}</div>`).join('')}
  <p><button id=sub>Nộp bài</button></p></div></div></main>`;
  listen('addEventListener');
  document.documentElement.requestFullscreen?.().catch(() => {});
  const finish = async auto => {
    if (finished) return;
    if (!auto) { quiet = true; const yes = confirm('Nộp bài ngay?'); quiet = false; if (!yes) return; }
    finished = true; clearInterval(timer); listen('removeEventListener');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    try { const r = await api(`/sessions/${s.session_id}/submit`, { answers: ans }); try { sessionStorage.removeItem(key); } catch {} alert(`Điểm: ${r.score} (${r.right}/${r.total} câu đúng)${r.late ? ' — nộp muộn' : ''}`); }
    finally { go('grades'); }
  };
  $('#sub').onclick = () => finish(false);
  const tick = () => { const ms = s.deadline - Date.now(), sec = Math.max(0, Math.ceil(ms / 1000)); $('#left').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; if (ms <= 0) finish(true); };
  tick(); timer = setInterval(tick, 500);
}

  <p class="muted">Edge AI xử lý video ngay tại thiết bị, chỉ gửi sự kiện bất thường — không gửi khung hình thô lên cloud. Khóa chỉ hiện một lần và được lưu dạng hash; mất khóa thì thu hồi và cấp lại.</p></div></div>`;
};
async function addDevice() { const r = await api('/devices', { name: v('#dn'), room: v('#dm') }); prompt('Khóa thiết bị (chỉ hiện một lần — hãy lưu lại):', r.key); go('devices'); }

// ---------- Kết quả học tập & chuẩn đầu ra ----------
P.grades = async () => {
  const rows = await api('/grades'), st = staff(), now = nowStr(), today = ymd();
  const state = r => r.score != null ? `<b>${r.score}</b> / ${r.max}` : r.ts ? 'Đã nộp — chờ chấm'
    : r.kind === 'Bài tập' ? (r.due < now ? '<span class="bad">Quá hạn</span>' : 'Chưa nộp') : (r.due < today ? '<span class="bad">Vắng thi</span>' : 'Chưa thi');
  return Object.entries(Object.groupBy(rows, r => r.code + ' — ' + r.course)).map(([course, list]) => {
    const g = list.filter(r => r.score != null), got = g.reduce((a, r) => a + r.score, 0), max = g.reduce((a, r) => a + r.max, 0);
    return `<div class="card"><h3>${esc(course)}</h3><table><tr><th>Mục<th>Loại<th>Hạn${st ? '<th>Sinh viên' : ''}<th>Điểm / trạng thái<th>Ghi chú</tr>
    ${list.map(r => `<tr><td>${esc(r.item)}<td>${r.kind}<td>${dt(r.due)}${st ? `<td>${esc(r.student)}` : ''}<td>${state(r)}<td>${r.kind === 'Kỳ thi' ? REVIEW[r.note] || '' : esc(r.note)}</tr>`).join('')}</table>
    ${!st && max ? `<p class="more">Tổng các mục đã chấm: <b>${+got.toFixed(2)} / ${max}</b> (${Math.round(got / max * 100)}%)</p>` : ''}</div>`;
  }).join('') || empty('Chưa có dữ liệu điểm.');
};
P.goals = async () => {
  const [gs, courses] = await Promise.all([api('/goals'), user.role === 'teacher' ? api('/courses') : []]);
  return (courses.length ? `<div class="bar"><b>Thêm CLO</b><select id=gc>${courses.map(c => `<option value=${c.id}>${esc(c.code)}</option>`).join('')}</select><input id=gk placeholder="CLO3" style="width:90px"><input id=gt placeholder="Mô tả chuẩn đầu ra" style="flex:1"><button onclick="add('/outcomes',{course_id:+v('#gc'),code:v('#gk'),text:v('#gt')},'goals')">Thêm</button></div>` : '') +
    `<p class="muted">Chuẩn đầu ra học phần (CLO). Giảng viên gắn câu hỏi thi với CLO để đo mức đạt chuẩn.</p><div class="card">${gs.length ? `<table><tr><th>Khóa<th>Mã<th>Mô tả<th>Số câu hỏi gắn</tr>${gs.map(g => `<tr><td>${esc(g.course_code)}<td><b>${esc(g.code)}</b><td>${esc(g.text)}<td>${g.questions}</tr>`).join('')}</table>` : empty('Chưa có chuẩn đầu ra.')}</div>`;
};
P.goalperf = async () => {
  const gs = await api('/goals');
  return `<p class="muted">${staff() ? 'Tỉ lệ trả lời đúng của cả lớp' : 'Tỉ lệ trả lời đúng của bạn'} trên các câu hỏi gắn với từng chuẩn đầu ra. Ngưỡng đạt: 50%.</p>
  <div class="card">${gs.length ? `<table><tr><th>Khóa<th>CLO<th>Mô tả<th>Lượt trả lời<th>Tỉ lệ đúng<th>Đánh giá</tr>${gs.map(g => `<tr><td>${esc(g.course_code)}<td><b>${esc(g.code)}</b><td>${esc(g.text)}<td>${g.attempts}<td>${g.pct == null ? '—' : bar(g.pct)}<td>${g.pct == null ? '<span class="muted">Chưa có dữ liệu</span>' : g.pct >= 50 ? '<span class="ok">Đạt</span>' : '<span class="bad">Chưa đạt</span>'}</tr>`).join('')}</table>` : empty('Chưa có chuẩn đầu ra.')}</div>`;
};

// ---------- Thông báo ----------
P.announcements = async () => {
  const [ann, courses] = await Promise.all([api('/announcements'), user.role === 'teacher' ? api('/courses') : []]);
  const list = ann.filter(a => annTab === 'all' || (annTab === 'inst') === !a.course_id);
  const form = user.role === 'student' ? '' : `<div class="card"><h3>Đăng thông báo ${user.role === 'proctor' ? 'toàn trường' : 'khóa học'}</h3><div class="form2">${courses.length ? `<select id=ac>${courses.map(c => `<option value=${c.id}>${esc(c.code)} — ${esc(c.title)}</option>`).join('')}</select>` : ''}
    <input id=at placeholder="Tiêu đề"><textarea id=ab placeholder="Nội dung"></textarea><button onclick="add('/announcements',{course_id:+($('#ac')?.value)||null,title:v('#at'),body:v('#ab')},'announcements')">Đăng</button></div></div>`;
  return form + `<div class="tabs">${[['inst', 'Toàn trường'], ['course', 'Khóa học'], ['all', 'Xem tất cả']].map(([k, l]) => `<a class="${k === annTab ? 'on' : ''}" onclick="annTab='${k}';go('announcements')">${l}</a>`).join('')}</div>
  <div class="card">${list.map(a => `<div class="ann"><div><h4>${esc(a.title)}</h4><div class="muted">Đăng lúc: ${fmt(a.ts)}</div><p class="pre">${esc(a.body)}</p></div>
    <div class="muted">Đăng bởi: ${esc(a.author)}<br>Gửi tới: ${a.course_id ? esc(a.code + ' — ' + a.course) : 'Toàn trường'}</div></div>`).join('') || empty('Không có thông báo.')}</div>`;
};

// ---------- Lịch ----------
P.calendar = async () => {
  const courses = await api('/courses'), { y, m } = cal, today = ymd();
  const cals = [[0, 'Cá nhân'], ...courses.map(c => [c.id, c.code + ' — ' + c.title])], items = due.filter(x => !hiddenCal.has(x.course_id || 0));
  const first = 1 - new Date(y, m, 1).getDay(); // ô đầu tiên = Chủ nhật trước ngày 1
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(y, m, first + i), key = ymd(d);
    return `<div class="${d.getMonth() !== m ? 'dim' : ''} ${key === today ? 'today' : ''}"><b>${d.getDate()}</b>${items.filter(x => x.date?.slice(0, 10) === key).sort((a, b) => a.date.localeCompare(b.date)).map(x =>
      `<a class="ev" style="background:${color(x.course_id)}" title="${KIND[x.kind]}: ${esc(x.title)}" onclick="${openItem(x)};return false">${x.date.length > 10 ? `<i>${x.date.slice(11, 16)}</i>` : ''}${esc(x.title)}${x.done ? ' ✓' : ''}</a>`).join('')}</div>`;
  }).join('');
  return `<div class="calwrap"><div class="card"><h3>Lịch của tôi</h3><div>
    <div class="row"><input id=cd type=date value=${today}><input id=ct placeholder="Sự kiện cá nhân" style="flex:1"><button onclick="add('/calendar',{title:v('#ct'),date:v('#cd')},'calendar')">Thêm</button></div>
    <p class="muted" style="margin:12px 0 4px">CÁC LỊCH</p>${cals.map(([id, name]) => `<label class="calsel"><input type=checkbox ${hiddenCal.has(id) ? '' : 'checked'} onchange="hiddenCal.has(${id})?hiddenCal.delete(${id}):hiddenCal.add(${id});go('calendar')"><i style="background:${color(id)}"></i>${esc(name)}</label>`).join('')}
    <p class="muted">✓ = đã nộp / đã hoàn thành</p></div></div>
  <div><div class="bar"><button onclick="calGo(-1)">◀</button><button onclick="calGo(1)">▶</button><button onclick="cal={y:new Date().getFullYear(),m:new Date().getMonth()};go('calendar')">Hôm nay</button><b style="font-size:18px">Tháng ${m + 1} / ${y}</b></div>
  <div class="cal">${['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => `<div class="h">${d}</div>`).join('')}${cells}</div></div></div>`;
};
function calGo(d) { const x = new Date(cal.y, cal.m + d, 1); cal = { y: x.getFullYear(), m: x.getMonth() }; go('calendar'); }

// ---------- Công việc ----------
P.tasks = async () => {
  const all = await api('/tasks'), list = all.filter(t => taskFilter === 'all' || (taskFilter === 'done') === !!t.done);
  return `<div class="bar"><b>Tạo công việc cá nhân</b><input id=tt placeholder="Tên công việc" style="flex:1"><input id=td type=date><button onclick="add('/tasks',{title:v('#tt'),due:v('#td')},'tasks')">Tạo</button></div>
  <div class="row">Hiển thị <select onchange="taskFilter=this.value;go('tasks')">${[['all', 'Tất cả'], ['open', 'Chưa xong'], ['done', 'Đã xong']].map(o => `<option value=${o[0]} ${o[0] === taskFilter ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
  <div class="card">${list.map(t => `<div class="item row" style="margin:0"><input type=checkbox ${t.done ? 'checked' : ''} onchange="add('/tasks/${t.id}/toggle',{},'tasks')"><span class="${t.done ? 'done' : ''}">${esc(t.title)}</span><span class="muted">${t.due || ''}</span></div>`).join('') || empty('Không có mục nào.')}</div>`;
};

// ---------- Email (theo khóa học) ----------
P.email = async () => {
  const [courses, box] = await Promise.all([api('/courses'), api('/messages')]), list = box[mailTab];
  return `<div class="card"><h3>Khóa học đang tham gia — chọn khóa để gửi email</h3><div class="list">${courses.map(c => L(`go('emailTo',${c.id})`, `<b>${esc(c.title)}</b> (${esc(c.code)})`)).join('') || empty('Chưa có khóa học.')}</div></div>
  <div class="tabs">${[['inbox', `Hộp thư đến (${box.inbox.length})`], ['sent', `Đã gửi (${box.sent.length})`]].map(([k, l]) => `<a class="${k === mailTab ? 'on' : ''}" onclick="mailTab='${k}';go('email')">${l}</a>`).join('')}</div>
  <div class="card">${list.map(m => `<div class="item"><b>${esc(m.subject)}</b> <span class="muted">${mailTab === 'inbox' ? 'từ ' + esc(m.from_name) + ' &lt;' + esc(m.from_email) + '&gt;' : 'tới ' + esc(m.to_email)} · ${m.code ? esc(m.code) + ' · ' : ''}${fmt(m.ts)}</span><div class="mail">${esc(m.body)}</div></div>`).join('') || empty('Chưa có thư.')}</div>`;
};
P.emailTo = async id => {
  const c = await api('/courses/' + id), others = c.roster.filter(m => m.email !== user.email);
  return `<p>${L("go('email')", '← Chọn khóa học khác')}</p><div class="card"><h3>${esc(c.code)} — ${esc(c.title)}</h3><div>
  <div class="row">Người nhận <select id=mto><option value=all>Tất cả thành viên</option><option value=students>Tất cả sinh viên</option><option value=teachers>Tất cả giảng viên</option><optgroup label="Chọn một người">${others.map(m => `<option value="${esc(m.email)}">${esc(m.name)} (${ROLE[m.role]})</option>`).join('')}</optgroup></select></div>
  <div class="row"><input id=ms placeholder="Tiêu đề" style="flex:1"></div><textarea id=mb placeholder="Nội dung"></textarea>
  <div class="row"><button onclick="sendMail(${c.id})">Gửi</button></div></div></div>`;
};
async function sendMail(cid) { const r = await api('/messages', { course_id: cid, to: v('#mto'), subject: v('#ms'), body: v('#mb') }); alert(`Đã gửi tới ${r.sent} người.`); mailTab = 'sent'; go('email'); }

// ---------- Danh bạ / Sổ địa chỉ / Thông tin cá nhân ----------
P.directory = () => `<p class="muted">Chỉ những người dùng chọn hiển thị trong danh bạ mới xuất hiện khi tìm kiếm.</p>
  <div class="bar"><span class="sp"></span>${L("go('profile')", 'Chỉnh quyền riêng tư của tôi')}</div>
  <div class="row"><b>Tìm:</b><select id=df><option value=name>Họ tên</option><option value=email>Email</option></select>${OPS('dop')}<input id=dq><select id=dr><option value="">Mọi vai trò</option>${Object.entries(ROLE).map(([k, l]) => `<option value=${k}>${l}</option>`).join('')}</select><button onclick="dirSearch()">Tìm</button></div><div class="card" id=dres></div>`;
P.directory_ = () => dirSearch();
async function dirSearch() {
  const r = await api(`/users?f=${v('#df')}&op=${v('#dop')}&q=${encodeURIComponent(v('#dq'))}&role=${v('#dr')}`);
  $('#dres').innerHTML = r.length ? `<table><tr><th>Họ tên<th>Email<th>Vai trò</tr>${r.map(u => `<tr><td>${esc(u.name)}<td>${esc(u.email)}<td>${ROLE[u.role]}</tr>`).join('')}</table>` : empty('Không tìm thấy.');
}
P.addressbook = () => `<div class="bar"><b>Tạo liên hệ</b><input id=an placeholder="Họ tên"><input id=ae placeholder="Email"><input id=ap placeholder="Điện thoại"><button onclick="add('/contacts',{name:v('#an'),email:v('#ae'),phone:v('#ap')},'addressbook')">Lưu</button></div>
  <div class="row"><b>Liên hệ</b><label><input type=radio name=af value=name checked> Họ tên</label><label><input type=radio name=af value=email> Email</label>${OPS('aop')}<input id=aq><button onclick="abSearch()">Tìm</button></div><div class="card" id=ares></div>`;
P.addressbook_ = () => abSearch();
async function abSearch() {
  const r = await api(`/contacts?f=${$('input[name=af]:checked').value}&op=${v('#aop')}&q=${encodeURIComponent(v('#aq'))}`);
  $('#ares').innerHTML = r.length ? `<table><tr><th>Họ tên<th>Email<th>Điện thoại<th></tr>${r.map(c => `<tr><td>${esc(c.name)}<td>${esc(c.email)}<td>${esc(c.phone)}<td><button class="ghost" onclick="add('/contacts/${c.id}/delete',{},'addressbook')">Xóa</button></tr>`).join('')}</table>` : empty('Không có liên hệ.');
}
P.profile = async () => {
  const me = await api('/me');
  return `<div class="card"><h3>Thông tin cá nhân</h3><div class="form">
  <label>Họ tên <input id=pn value="${esc(me.name)}"></label><label>Email <input value="${esc(me.email)}" disabled></label><label>Vai trò <input value="${ROLE[me.role]}" disabled></label>
  <label class="chk"><input id=pl type=checkbox ${me.listed ? 'checked' : ''}> Hiển thị tôi trong Danh bạ người dùng</label>
  <fieldset><legend>Đổi mật khẩu (bỏ trống nếu không đổi)</legend><input id=po type=password placeholder="Mật khẩu hiện tại" autocomplete="current-password"><input id=pp type=password placeholder="Mật khẩu mới (≥ 6 ký tự)" autocomplete="new-password"></fieldset>
  <button onclick="saveProfile()">Lưu</button></div></div>`;
};
async function saveProfile() { await api('/me', { name: v('#pn'), listed: $('#pl').checked, old: v('#po'), password: v('#pp') }); user.name = v('#pn').trim(); persist(); alert('Đã lưu.'); go('profile'); }

const [page, arg] = location.hash.slice(1).split('/');
token ? go(Object.hasOwn(P, page) && !page.endsWith('_') ? page : 'home', arg ? +arg : undefined) : login();
</script></body></html>
